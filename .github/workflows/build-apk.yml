name: Build BW Foot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project
        run: |
          set -e
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Android project files found."

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK archive and signature
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK size in bytes:"
          stat -c%s "$APK"

          echo "Checking APK archive..."
          unzip -t "$APK"

          echo "Checking compiled app files..."
          unzip -l "$APK" | grep -E 'classes[0-9]*[.]dex|AndroidManifest.xml'

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          ZIPALIGN="$(find "$ANDROID_HOME/build-tools" -type f -name zipalign | sort -V | tail -n 1)"

          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"

          echo "Checking APK alignment..."
          "$ZIPALIGN" -c -v 4 "$APK"

          echo "Checking APK signature..."
          "$APKSIGNER" verify --verbose "$APK"

          echo "All APK checks passed."

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BW-Foot-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
