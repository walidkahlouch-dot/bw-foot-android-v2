
name: Build BW Foot Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Android project
        run: |
          echo "Checking project files..."
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          find app/src/main -type f

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file not found"
            find app/build/outputs -type f
            exit 1
          fi

          echo "APK size:"
          stat -c%s "$APK"

          echo "Checking APK archive..."
          unzip -t "$APK"

          echo "Checking compiled app files..."
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest.xml'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BW-Foot-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
