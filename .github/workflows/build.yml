name: Build BW Foot Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Android project
        run: |
          echo "Checking repository files"
          find . -maxdepth 3 -type f | head -100
